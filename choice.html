<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#091122">
  <meta name="description" content="KICKOFF PARTY 2027 — 漢字ごとに赤・青、二つのお題から選ぶクイズページ。">
  <title>お題を選ぶ | KICKOFF PARTY 2027</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
      --base: #091122;
      --paper: #fff;
      --muted: #b8c3d9;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100svh;
      overflow-x: hidden;
      color: var(--paper);
      background:
        radial-gradient(ellipse 72% 55% at 50% -20%, #293963, transparent 80%),
        radial-gradient(ellipse 32% 31% at -15% 90%, #183659, transparent 80%),
        #091122;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: .13;
      background-image: radial-gradient(circle, #a3b6dc 0.8px, transparent 1px);
      background-size: 26px 26px;
      pointer-events: none;
    }
    button, a { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible { outline: 3px solid #ffe097; outline-offset: 5px; }
    .wrap {
      width: min(1240px, calc(100% - 56px));
      margin: 0 auto;
      padding: 28px 0 42px;
    }
    .site-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .brand {
      display: inline-flex;
      gap: 10px;
      align-items: center;
      color: #e0eafb;
      font: 800 12px/1.4 system-ui, sans-serif;
      letter-spacing: .14em;
      text-decoration: none;
    }
    .brand-icon {
      display: grid;
      place-items: center;
      flex: none;
      width: 31px;
      height: 31px;
      border-radius: 9px;
      color: #16243f;
      background: #f7d680;
      font-size: 16px;
      box-shadow: 0 0 22px #f9d7833f;
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: #d3def1;
      text-decoration: none;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .035em;
      border: 1px solid #ffffff38;
      border-radius: 999px;
      padding: 10px 16px;
      background: #ffffff0c;
      transition: background .2s, border-color .2s;
    }
    .back:hover { background: #ffffff1c; border-color: #ffffff70; }
    .intro { padding: 36px 0 32px; text-align: center; }
    .eyebrow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #efcd7a;
      font: 850 11px/1.4 system-ui, sans-serif;
      letter-spacing: .27em;
    }
    .eyebrow::before, .eyebrow::after {
      content: "";
      display: block;
      width: 30px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #eccb7e);
    }
    .eyebrow::after { transform: rotate(180deg); }
    .topicline { display: flex; align-items: center; justify-content: center; gap: 13px; margin: 12px 0 6px; }
    .topic-icon {
      display: grid;
      place-items: center;
      flex: none;
      width: 55px;
      height: 55px;
      border: 1px solid #ffde8880;
      border-radius: 15px;
      color: #ffdf9b;
      background: #f6c66d18;
      font: 900 35px/1 "Yu Mincho", "Hiragino Mincho ProN", serif;
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 4.6vw, 51px);
      line-height: 1.25;
      letter-spacing: .06em;
      font-weight: 950;
      text-wrap: balance;
    }
    .subtitle {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: clamp(12px, 1.25vw, 14px);
      line-height: 1.9;
      letter-spacing: .05em;
    }
    .stage-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 14px;
      padding-inline: 2px;
      color: #a5b6d5;
      font: 800 11px/1.4 system-ui, sans-serif;
      letter-spacing: .15em;
    }
    .stage-head span:first-child { display: flex; align-items: center; gap: 10px; color: #d9e5f9; }
    .stage-head span:first-child::before { content: ""; width: 4px; height: 16px; border-radius: 4px; background: #f5ce7c; }
    .versus {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0,1fr) minmax(0,1fr);
      gap: 20px;
      align-items: stretch;
    }
    .choice {
      --light: #f5747a;
      --dark: #8e1e39;
      position: relative;
      display: flex;
      isolation: isolate;
      flex-direction: column;
      align-items: stretch;
      width: 100%;
      min-width: 0;
      min-height: min(480px, 54svh);
      overflow: hidden;
      padding: 27px clamp(24px, 3.2vw, 42px) 29px;
      appearance: none;
      border: 1px solid #ffffff80;
      border-radius: 23px;
      color: #fff;
      text-align: left;
      cursor: pointer;
      font: inherit;
      background:
        radial-gradient(ellipse 78% 70% at 10% 0%, #ffffff50, transparent 74%),
        linear-gradient(146deg, var(--light), var(--dark));
      box-shadow: inset 0 2px 0 #ffffff42, 0 17px 40px #0007;
      transform: translateY(0);
      transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
    }
    .choice::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 9px;
      border: 1px solid #ffffff35;
      border-radius: 15px;
      pointer-events: none;
    }
    .choice::after {
      content: "";
      position: absolute;
      z-index: -1;
      right: -120px;
      bottom: -150px;
      width: 430px;
      height: 430px;
      border-radius: 50%;
      border: 1px solid #ffffff37;
      box-shadow: 0 0 0 60px #ffffff0a, 0 0 0 123px #ffffff07;
      pointer-events: none;
    }
    .choice--blue { --light: #55aceb; --dark: #1751a9; }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }
    .color-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font: 900 14px/1.2 system-ui, sans-serif;
      letter-spacing: .17em;
    }
    .color-dot {
      display: grid;
      place-items: center;
      width: 35px;
      height: 35px;
      border: 1px solid #ffffff9c;
      border-radius: 50%;
      background: #ffffff21;
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 0;
    }
    .color-sub { color: #fff9; font: 750 11px/1.2 system-ui,sans-serif; letter-spacing: .14em; }
    .prompt {
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 42px 0;
      min-width: 0;
    }
    .prompt-prefix {
      display: block;
      font-size: clamp(20px, 2.25vw, 30px);
      font-weight: 850;
      line-height: 1.75;
      letter-spacing: .03em;
      overflow-wrap: anywhere;
      text-wrap: pretty;
      text-shadow: 0 2px 8px #0002;
    }
    .prompt-phrase {
      display: inline-block;
      max-width: 100%;
      margin-top: 22px;
      padding: 9px 14px;
      border: 1px solid #ffffff82;
      border-radius: 10px;
      font-size: clamp(19px, 2.1vw, 28px);
      line-height: 1.6;
      font-weight: 900;
      letter-spacing: .03em;
      background: #ffffff27;
      box-shadow: 0 6px 18px #0002;
      white-space: normal;
      text-wrap: balance;
    }
    .bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-top: 1px solid #ffffff48;
      padding-top: 18px;
      font-size: 13px;
      font-weight: 850;
      letter-spacing: .08em;
    }
    .bottom-icon { font-size: 22px; line-height: 1; transition: transform .2s; }
    .choice:hover { transform: translateY(-5px); box-shadow: inset 0 2px 0 #ffffff6b, 0 24px 48px #000a; border-color: #fff; }
    .choice:hover .bottom-icon { transform: translateX(5px); }
    .choice:active { transform: scale(.99); }
    .choice[aria-pressed="true"] { border: 3px solid #fff5bc; box-shadow: 0 0 0 5px #f7db7d48, 0 24px 49px #0008; padding: 25px clamp(22px, calc(3.2vw - 2px), 40px) 27px; }
    .choice[aria-pressed="true"] .bottom-icon { transform: none; }
    .choice[aria-pressed="true"] .bottom-label::after { content: " ✓"; }
    .vs {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 4;
      display: grid;
      place-items: center;
      width: 65px;
      height: 65px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 5px solid #0b1428;
      background: #f7e2b0;
      color: #18213d;
      font: 950 italic 23px system-ui, sans-serif;
      box-shadow: 0 5px 30px #0009;
      pointer-events: none;
    }
    .choice-result {
      min-height: 28px;
      margin: 25px 0 0;
      color: #c9d7ed;
      text-align: center;
      font-size: 13px;
      font-weight: 750;
      letter-spacing: .08em;
    }
    .choice-result[data-selected="red"] { color: #ffb4b9; }
    .choice-result[data-selected="blue"] { color: #99ccff; }
    .footer-link {
      display: flex;
      width: fit-content;
      margin: 25px auto 0;
      color: #b7c6e2;
      text-decoration: none;
      font-size: 12px;
      font-weight: 800;
      border-bottom: 1px solid #ffffff58;
      padding-bottom: 5px;
    }
    .footer-link:hover { color: #fff; }
    @media (max-width: 920px) {
      .wrap { width: min(800px, calc(100% - 38px)); }
      .versus { gap: 14px; }
      .choice { min-height: 420px; padding: 23px 23px 25px; border-radius: 19px; }
      .choice[aria-pressed="true"] { padding: 21px 21px 23px; }
      .prompt-prefix { font-size: clamp(19px, 2.8vw, 24px); }
      .prompt-phrase { font-size: clamp(18px, 2.5vw, 23px); }
      .vs { width: 53px; height: 53px; border-width: 4px; font-size: 19px; }
    }
    @media (max-width: 650px) {
      .wrap { width: min(520px, calc(100% - 30px)); padding-top: 18px; }
      .brand { font-size: 10px; letter-spacing: .04em; gap: 7px; }
      .brand-icon { width: 26px; height: 26px; font-size: 13px; border-radius: 7px; }
      .back { font-size: 11px; padding: 8px 10px; }
      .intro { padding: 29px 0 24px; }
      .topic-icon { width: 45px; height: 45px; font-size: 28px; border-radius: 11px; }
      h1 { font-size: 29px; }
      .subtitle { margin-top: 9px; }
      .stage-head { font-size: 10px; }
      .versus { grid-template-columns: minmax(0,1fr); gap: 18px; }
      .choice { min-height: 260px; padding: 23px 24px 23px; }
      .choice[aria-pressed="true"] { padding: 21px 22px 21px; }
      .prompt { padding: 24px 0; }
      .prompt-prefix { font-size: clamp(21px, 5.2vw, 27px); line-height: 1.64; }
      .prompt-phrase { font-size: clamp(20px, 4.8vw, 25px); margin-top: 15px; }
      .vs { width: 48px; height: 48px; font-size: 17px; }
      .choice-result { margin-top: 18px; font-size: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="site-head">
      <a class="brand" href="./" aria-label="トップページへ戻る"><span class="brand-icon" aria-hidden="true">✦</span><span>KICKOFF PARTY 2027</span></a>
      <a class="back" href="./"><span aria-hidden="true">←</span> ジャンル選択へ</a>
    </header>
    <section class="intro" aria-labelledby="page-title">
      <div class="eyebrow">CHOOSE YOUR CHALLENGE</div>
      <div class="topicline"><span class="topic-icon" id="topic-kanji" aria-hidden="true"></span><h1 id="page-title">お題を選ぶ</h1></div>
      <p class="subtitle">同じ「お世話様です」でも、シチュエーションは大違い。<br>赤か青、挑戦したいお題を選んでください。</p>
    </section>
    <div class="stage-head" aria-label="お題の情報"><span>TWO CHOICES</span><span id="topic-count">01 / 08</span></div>
    <section class="versus" aria-label="赤と青の2つのお題">
      <button class="choice choice--red" id="choice-red" type="button" aria-pressed="false" aria-label="赤のお題を選ぶ">
        <span class="top"><span class="color-label"><span class="color-dot">A</span> RED / 赤</span><span class="color-sub">CHALLENGE 01</span></span>
        <span class="prompt"><span class="prompt-prefix" id="prompt-red"></span><span class="prompt-phrase" id="phrase-red">「お世話様です」</span></span>
        <span class="bottom"><span class="bottom-label" id="bottom-red">このお題を選ぶ</span><span class="bottom-icon" aria-hidden="true">→</span></span>
      </button>
      <span class="vs" aria-hidden="true">VS</span>
      <button class="choice choice--blue" id="choice-blue" type="button" aria-pressed="false" aria-label="青のお題を選ぶ">
        <span class="top"><span class="color-label"><span class="color-dot">B</span> BLUE / 青</span><span class="color-sub">CHALLENGE 02</span></span>
        <span class="prompt"><span class="prompt-prefix" id="prompt-blue"></span><span class="prompt-phrase" id="phrase-blue">「お世話様です」</span></span>
        <span class="bottom"><span class="bottom-label" id="bottom-blue">このお題を選ぶ</span><span class="bottom-icon" aria-hidden="true">→</span></span>
      </button>
    </section>
    <p class="choice-result" id="choice-result" aria-live="polite">お題を選択すると、選んだカードが強調表示されます。</p>
    <a class="footer-link" href="./">← 8つのジャンルに戻る</a>
  </main>
  <script>
    "use strict";
    const topics = {
  "熱": {
    "red": "熱々のたこ焼きを口に入れているときの「お世話様です」",
    "blue": "熱々の小籠包を口に入れているときの「お世話様です」"
  },
  "可": {
    "red": "かわいらしい小さな子どもが言う「お世話様です」",
    "blue": "自分を子どもみたいにかわいいと思い込んでいる大人の「お世話様です」"
  },
  "痛": {
    "red": "舌を思いっきり噛んだ直後の「お世話様です」",
    "blue": "足の小指をタンスの角にぶつけた直後の「お世話様です」"
  },
  "格": {
    "red": "カッコいいイケメンボイスの「お世話様です」",
    "blue": "自分最高ナルシストの「お世話様です」"
  },
  "笑": {
    "red": "愛想笑いしながらもトイレに行きたいのを我慢している「お世話様です」",
    "blue": "「この間はどうも」と話しかけてくる相手が誰だか全く思い出せないまま返す「お世話様です」"
  },
  "秘": {
    "red": "背中に銃口を当てられ「普段どおりに振るまえ」と脅されているときの「お世話様です」",
    "blue": "まだ見られてはいけないサプライズプレゼントを背中に隠しているときの「お世話様です」"
  },
  "焦": {
    "red": "大寝坊で遅刻していることに目覚めて気付き、上司から電話がかかってきたときの「お世話様です」",
    "blue": "もう帰る気満々で勢いよく立ちあがった瞬間に上司に呼び止められたときの「お世話様です」"
  },
  "達": {
    "red": "今年度売上25ペソ達成に向けて気合いを入れる「お世話様です」",
    "blue": "今年度売上25億円達成に向けて気合いを入れる「お世話様です」"
  }
};
    const order = ["熱", "可", "痛", "格", "笑", "秘", "焦", "達"];
    const params = new URLSearchParams(window.location.search);
    const topic = params.get("topic");
    if (!Object.prototype.hasOwnProperty.call(topics, topic)) {
      document.getElementById("topic-kanji").textContent = "？";
      document.getElementById("page-title").textContent = "お題が見つかりません";
      document.querySelector(".subtitle").textContent = "ジャンル選択画面から漢字を選び直してください。";
      document.querySelector(".versus").hidden = true;
      document.querySelector(".stage-head").hidden = true;
      document.getElementById("choice-result").hidden = true;
    } else {
      const prompt = topics[topic];
      const phrase = "「お世話様です」";
      const putText = (side) => {
        const whole = prompt[side];
        const position = whole.lastIndexOf(phrase);
        document.getElementById("prompt-" + side).textContent = position < 0 ? whole : whole.slice(0, position);
        document.getElementById("phrase-" + side).textContent = position < 0 ? "" : whole.slice(position);
      };
      document.title = "「" + topic + "」のお題 | KICKOFF PARTY 2027";
      document.getElementById("topic-kanji").textContent = topic;
      document.getElementById("page-title").textContent = "「" + topic + "」のお題";
      document.getElementById("topic-count").textContent = String(order.indexOf(topic) + 1).padStart(2,"0") + " / 08";
      putText("red");
      putText("blue");
      const buttons = {
        red: document.getElementById("choice-red"),
        blue: document.getElementById("choice-blue")
      };
      const result = document.getElementById("choice-result");
      const select = (side) => {
        buttons.red.setAttribute("aria-pressed", String(side === "red"));
        buttons.blue.setAttribute("aria-pressed", String(side === "blue"));
        result.dataset.selected = side;
        result.textContent = (side === "red" ? "赤" : "青") + "のお題を選択しました。別のお題にも切り替えられます。";
      };
      buttons.red.addEventListener("click", () => select("red"));
      buttons.blue.addEventListener("click", () => select("blue"));
    }
  </script>
</body>
</html>
