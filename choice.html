<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#091122">
  <meta name="description" content="お世話様ですって言うゲーム — 赤と青の2つのお題。">
  <title>お題 | KICKOFF PARTY 2027</title>
  <link rel="stylesheet" href="navigation.css">
  <style>
    :root {
      color-scheme: dark;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, system-ui, sans-serif;
      color: white;
      background: #091122;
    }
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { min-height: 100%; }
    body {
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      background: radial-gradient(ellipse 70% 50% at 50% -25%, #293963, transparent 85%), #091122;
    }
    .wrap {
      display: flex;
      flex-direction: column;
      width: min(1660px, calc(100% - 50px));
      min-height: 100svh;
      margin: 0 auto;
      padding: 20px 0 98px;
    }
    .site-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      min-height: 58px;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0;
      font-size: clamp(27px, 3vw, 46px);
      line-height: 1.3;
      font-weight: 950;
      letter-spacing: .06em;
      text-shadow: 0 2px 16px #0007;
    }
    .back {
      flex: none;
      display: grid;
      place-items: center;
      width: 43px;
      height: 43px;
      border: 1px solid #ffffff66;
      border-radius: 50%;
      color: white;
      font: 26px/1 system-ui, sans-serif;
      text-decoration: none;
      background: #ffffff16;
      -webkit-tap-highlight-color: transparent;
    }
    .back:hover { background: #ffffff2c; }
    .back:focus-visible { outline: 3px solid #ffe097; outline-offset: 4px; }
    .versus {
      display: grid;
      flex: 1;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(12px, 1.3vw, 20px);
      align-items: stretch;
      min-height: 0;
    }
    .choice {
      --light: #f36b73;
      --dark: #ac2945;
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: min(620px, 78svh);
      padding: clamp(25px, 2.5vw, 44px);
      overflow: hidden;
      border: 1px solid #ffffff8e;
      border-radius: clamp(15px, 1.6vw, 26px);
      background:
        radial-gradient(ellipse 78% 55% at 12% 0%, #ffffff3b 0%, transparent 85%),
        linear-gradient(145deg, var(--light), var(--dark));
      box-shadow: inset 0 2px 0 #ffffff45, 0 18px 35px #0007;
      cursor: default;
    }
    .choice::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 9px;
      border: 1px solid #ffffff3a;
      border-radius: 17px;
      pointer-events: none;
    }
    .choice::after {
      content: "";
      position: absolute;
      z-index: -1;
      width: 540px;
      height: 540px;
      right: -245px;
      bottom: -250px;
      border: 1px solid #ffffff2b;
      border-radius: 50%;
      box-shadow: 0 0 0 80px #ffffff07, 0 0 0 160px #ffffff05;
      pointer-events: none;
    }
    .choice--blue { --light: #54a9f1; --dark: #1c50a5; }
    .color-label {
      display: block;
      flex: none;
      font-size: clamp(19px, 1.6vw, 29px);
      font-weight: 900;
      line-height: 1.3;
      letter-spacing: .055em;
    }
    .prompt {
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
      text-align: center;
      padding: 22px 0 28px;
      text-wrap: pretty;
    }
    .prompt-main {
      display: block;
      max-width: 100%;
      font-size: clamp(28px, 2.75vw, 49px);
      font-weight: 900;
      line-height: 1.62;
      letter-spacing: .025em;
      overflow-wrap: anywhere;
      text-shadow: 0 3px 10px #0003;
    }
    .prompt--long .prompt-main { font-size: clamp(26px, 2.35vw, 42px); line-height: 1.56; }
    .prompt--very-long .prompt-main { font-size: clamp(24px, 2vw, 37px); line-height: 1.53; }
    .prompt-phrase {
      display: inline-block;
      max-width: 100%;
      margin-top: clamp(20px, 3vh, 34px);
      padding: 8px 15px;
      border: 1px solid #ffffff8e;
      border-radius: 11px;
      background: #ffffff29;
      font-size: clamp(28px, 2.65vw, 48px);
      font-weight: 950;
      line-height: 1.55;
      letter-spacing: .025em;
      text-wrap: balance;
      box-shadow: 0 6px 20px #0002;
    }

    /* Dramatic entrance: animation ends in the existing, stationary reading layout. */
    .entrance-fx {
      position: fixed;
      inset: 0;
      z-index: 50;
      overflow: hidden;
      pointer-events: none;
      visibility: hidden;
    }
    .fx-stage .entrance-fx { visibility: visible; }
    .entrance-fx::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0;
      background: radial-gradient(ellipse at center, #fff7d7 0%, #fff1b8a8 18%, #fbc75d52 48%, transparent 78%);
    }
    .fx-stage .entrance-fx::before { animation: gold-flash 970ms ease-out both; }
    .fx-burst {
      position: absolute;
      left: 50%;
      top: 49%;
      width: min(130vmax, 1800px);
      aspect-ratio: 1;
      border-radius: 50%;
      opacity: 0;
      transform: translate(-50%,-50%) scale(.15);
      background:
        radial-gradient(circle, #fffce8 0%, #fff5d6ba 3%, #fbd7794d 10%, transparent 26%),
        repeating-conic-gradient(from 11deg, #ffe09e00 0deg, #ffe2a045 4deg, #ffe09e00 8deg, transparent 19deg);
      mask-image: radial-gradient(circle, #000 0%, #000 37%, transparent 70%);
      mix-blend-mode: screen;
    }
    .fx-stage .fx-burst { animation: golden-burst 1120ms cubic-bezier(.13,.61,.2,1) both; }
    .fx-ring {
      position: absolute;
      left: 50%;
      top: 49%;
      width: 11vmin;
      height: 11vmin;
      border: clamp(3px, .65vmin, 9px) solid #fff3c0;
      border-radius: 50%;
      opacity: 0;
      transform: translate(-50%,-50%) scale(.1);
      box-shadow: 0 0 15px #ffdb72, inset 0 0 22px #ffe7a7, 0 0 80px #ffca6899;
    }
    .fx-stage .fx-ring { animation: golden-ring 950ms .14s ease-out both; }
    .fx-sweep {
      position: absolute;
      inset: -90%;
      opacity: 0;
      transform: translateX(-65%) rotate(23deg);
      background: linear-gradient(90deg, transparent 47%, #fff7d900 48%, #ffefb0a1 49.6%, #fffdf2d9 50%, #ffcf6d66 50.4%, transparent 52%);
      mix-blend-mode: screen;
    }
    .fx-stage .fx-sweep { animation: light-sweep 1050ms .24s ease-out both; }
    .fx-confetti { position: absolute; inset: 0; width: 100%; height: 100%; }
    .fx-stage .choice--red { animation: red-grand-entrance 1080ms .12s cubic-bezier(.16,.84,.24,1) both; }
    .fx-stage .choice--blue { animation: blue-grand-entrance 1080ms .27s cubic-bezier(.16,.84,.24,1) both; }
    .fx-stage .site-head { animation: title-grand-entrance 720ms .75s cubic-bezier(.17,.8,.24,1) both; }
    .fx-stage .choice .color-label { animation: label-grand-entrance 730ms .87s ease-out both; }
    .fx-stage .choice .prompt { animation: prompt-grand-entrance 830ms 1.02s cubic-bezier(.17,.76,.24,1) both; }
    @keyframes gold-flash {
      0%, 12% { opacity: 0; }
      28% { opacity: .85; }
      55% { opacity: .22; }
      100% { opacity: 0; }
    }
    @keyframes golden-burst {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(.15) rotate(-20deg); }
      24% { opacity: .98; }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1.28) rotate(24deg); }
    }
    @keyframes golden-ring {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(.15); }
      22% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(17); }
    }
    @keyframes light-sweep {
      0% { opacity: 0; transform: translateX(-65%) rotate(23deg); }
      25% { opacity: .9; }
      100% { opacity: 0; transform: translateX(65%) rotate(23deg); }
    }
    @keyframes red-grand-entrance {
      0% { opacity: 0; transform: translate3d(-16vw,48px,0) scale(.77) rotate(-5deg); filter: brightness(1.8); }
      58% { opacity: 1; transform: translate3d(13px,-12px,0) scale(1.035) rotate(1deg); filter: brightness(1.28); }
      80% { transform: translate3d(-3px,3px,0) scale(.994); }
      100% { opacity: 1; transform: none; filter: brightness(1); }
    }
    @keyframes blue-grand-entrance {
      0% { opacity: 0; transform: translate3d(16vw,48px,0) scale(.77) rotate(5deg); filter: brightness(1.8); }
      58% { opacity: 1; transform: translate3d(-13px,-12px,0) scale(1.035) rotate(-1deg); filter: brightness(1.28); }
      80% { transform: translate3d(3px,3px,0) scale(.994); }
      100% { opacity: 1; transform: none; filter: brightness(1); }
    }
    @keyframes title-grand-entrance {
      0% { opacity: 0; transform: translateY(-24px) scale(1.12); filter: blur(7px); }
      65% { opacity: 1; transform: translateY(3px) scale(.99); filter: blur(0); }
      100% { opacity: 1; transform: none; }
    }
    @keyframes label-grand-entrance {
      0% { opacity: 0; transform: translateY(-18px); }
      100% { opacity: 1; transform: none; }
    }
    @keyframes prompt-grand-entrance {
      0% { opacity: 0; transform: translateY(42px) scale(.86); filter: blur(6px); }
      67% { opacity: 1; transform: translateY(-5px) scale(1.02); filter: blur(0); }
      100% { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .entrance-fx { display: none !important; }
      .fx-stage .choice, .fx-stage .choice .prompt, .fx-stage .choice .color-label,
      .fx-stage .site-head { animation: none !important; transform: none !important; filter: none !important; opacity: 1 !important; }
    }
    @media (max-width: 800px) {
      .wrap { width: min(720px, calc(100% - 26px)); padding-top: 12px; }
      .site-head { min-height: 48px; margin-bottom: 10px; }
      h1 { font-size: clamp(25px, 4.5vw, 34px); }
      .choice { padding: clamp(18px, 2.5vw, 26px); min-height: min(550px, 77svh); }
      .prompt-main { font-size: clamp(23px, 3.2vw, 30px); }
      .prompt--long .prompt-main { font-size: clamp(22px, 3vw, 28px); }
      .prompt--very-long .prompt-main { font-size: clamp(20px, 2.8vw, 26px); }
      .prompt-phrase { font-size: clamp(21px, 3.2vw, 29px); }
    }
    @media (max-width: 620px) {
      .wrap { width: calc(100% - 24px); padding: 12px 0 16px; }
      .site-head { margin-bottom: 12px; }
      h1 { font-size: clamp(24px, 6vw, 34px); }
      .back { width: 39px; height: 39px; font-size: 24px; }
      .versus { grid-template-columns: minmax(0, 1fr); gap: 13px; }
      .choice { min-height: 300px; padding: 24px; }
      .prompt { padding: 22px 0; }
      .color-label { font-size: 20px; }
      .prompt-main { font-size: clamp(24px, 5.7vw, 35px); }
      .prompt--long .prompt-main { font-size: clamp(23px, 5.2vw, 31px); }
      .prompt--very-long .prompt-main { font-size: clamp(22px, 4.9vw, 29px); }
      .prompt-phrase { font-size: clamp(24px, 5.6vw, 34px); }
    }
  </style>
</head>
<body>
  <div class="entrance-fx" aria-hidden="true">
    <div class="fx-burst"></div>
    <div class="fx-ring"></div>
    <div class="fx-sweep"></div>
    <canvas class="fx-confetti" id="fx-confetti"></canvas>
  </div>
  <main class="wrap">
    <header class="site-head">
      <h1 id="page-title"></h1>
    </header>
    <section class="versus" aria-label="赤と青のお題" id="prompts">
      <article class="choice choice--red" aria-label="赤のお題">
        <span class="color-label">RED / 赤</span>
        <div class="prompt" id="prompt-red"><span class="prompt-main" id="main-red"></span><span class="prompt-phrase" id="phrase-red"></span></div>
      </article>
      <article class="choice choice--blue" aria-label="青のお題">
        <span class="color-label">BLUE / 青</span>
        <div class="prompt" id="prompt-blue"><span class="prompt-main" id="main-blue"></span><span class="prompt-phrase" id="phrase-blue"></span></div>
      </article>
    </section>
  </main>
  <nav class="page-nav" aria-label="ページ移動">
    <a class="page-nav__button page-nav__button--back" href="categories.html"><span class="page-nav__arrow" aria-hidden="true">←</span><span>戻る</span></a>
  </nav>
  <script>
    "use strict";
    const topics = {
  "熱": {
    "red": "激熱のたこ焼きを口に入れているときの「お世話様です」",
    "blue": "激熱の小籠包を口に入れているときの「お世話様です」"
  },
  "可": {
    "red": "小さな子どもが言うかわいい「お世話様です」",
    "blue": "自分を子どもみたいにかわいいと思い込んでいる大人の「お世話様です」"
  },
  "痛": {
    "red": "舌を思いっきり噛んだ直後の「お世話様です」",
    "blue": "足の小指をタンスの角にぶつけた直後の「お世話様です」"
  },
  "格": {
    "red": "カッコいいイケメンボイスの「お世話様です」",
    "blue": "自分大好きナルシストの「お世話様です」"
  },
  "困": {
    "red": "愛想笑いしながらも今すぐトイレに行きたいのを我慢している「お世話様です」",
    "blue": "「この間はどうも」と話しかけてくる相手が誰だか全く思い出せないまま返す「お世話様です」"
  },
  "秘": {
    "red": "背中に銃口を当てられ「普段どおりに振るまえ」と脅されているときの「お世話様です」",
    "blue": "まだ見られてはいけないサプライズプレゼントを背中に隠しているときの「お世話様です」"
  },
  "焦": {
    "red": "目覚めたとき寝坊で大遅刻していることに気付き、上司から電話がかかってきたときの「お世話様です」",
    "blue": "もう帰る気満々で勢いよく立ちあがった瞬間に上司に呼び止められたときの「お世話様です」"
  },
  "達": {
    "red": "今年度売上27ペソ達成に向けて気合いを入れていくぞ、の「お世話様です」",
    "blue": "今年度売上27億円達成に向けて気合いを入れていくぞ、の「お世話様です」"
  }
};
    const query = new URLSearchParams(window.location.search);
    const topic = query.get("topic");
    const title = document.getElementById("page-title");
    const section = document.getElementById("prompts");
    if (!Object.prototype.hasOwnProperty.call(topics, topic)) {
      title.textContent = "お題が見つかりません";
      section.hidden = true;
    } else {
      const phrase = "「お世話様です」";
      title.textContent = "「" + topic + "」のお題";
      document.title = title.textContent + " | KICKOFF PARTY 2027";
      for (const side of ["red", "blue"]) {
        const full = topics[topic][side];
        const at = full.lastIndexOf(phrase);
        const main = at >= 0 ? full.slice(0, at) : full;
        const saying = at >= 0 ? full.slice(at) : "";
        document.getElementById("main-" + side).textContent = main;
        document.getElementById("phrase-" + side).textContent = saying;
        const cardText = document.getElementById("prompt-" + side);
        if (main.length >= 45) cardText.classList.add("prompt--very-long");
        else if (main.length >= 28) cardText.classList.add("prompt--long");
      }
    }

    function launchConfetti() {
      if (!window.requestAnimationFrame) return;
      const canvas = document.getElementById("fx-confetti");
      const context = canvas.getContext("2d");
      if (!context) return;

      let width = 0;
      let height = 0;
      let pixelRatio = 1;
      const resize = () => {
        pixelRatio = Math.min(window.devicePixelRatio || 1, 1.75);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      };
      resize();
      window.addEventListener("resize", resize, { passive: true });

      const palette = ["#fff9d8", "#ffda68", "#ffae3e", "#ffffff", "#fa7080", "#6db9ff", "#ffe6a3"];
      const count = Math.min(200, Math.max(95, Math.round(width / 9)));
      const centerX = width / 2;
      const centerY = height * .49;
      const pieces = Array.from({ length: count }, () => {
        const angle = Math.random() * Math.PI * 2;
        const speed = 240 + Math.random() * 760;
        return {
          x: centerX + (Math.random() - .5) * 35,
          y: centerY + (Math.random() - .5) * 35,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 170,
          rotation: Math.random() * Math.PI,
          spin: (Math.random() - .5) * 17,
          size: 3 + Math.random() * 8,
          color: palette[Math.floor(Math.random() * palette.length)],
          shape: Math.random() > .75 ? "spark" : "paper"
        };
      });
      const total = 2650;
      const startTime = performance.now();
      let priorTime = startTime;

      const stop = () => {
        window.removeEventListener("resize", resize);
        context.clearRect(0, 0, width, height);
        canvas.width = 0;
        canvas.height = 0;
      };

      const frame = (now) => {
        const elapsed = now - startTime;
        if (document.hidden || elapsed >= total) { stop(); return; }
        const seconds = Math.min((now - priorTime) / 1000, .05);
        priorTime = now;
        context.clearRect(0, 0, width, height);
        const fade = Math.max(0, Math.min(1, (total - elapsed) / 650));
        context.globalAlpha = fade;
        for (const p of pieces) {
          p.vx *= Math.pow(.988, seconds * 60);
          p.vy += 480 * seconds;
          p.x += p.vx * seconds;
          p.y += p.vy * seconds;
          p.rotation += p.spin * seconds;
          if (p.x < -20 || p.x > width + 20 || p.y > height + 20) continue;
          context.save();
          context.translate(p.x, p.y);
          context.rotate(p.rotation);
          context.fillStyle = p.color;
          if (p.shape === "spark") {
            context.fillRect(-p.size * .18, -p.size, p.size * .36, p.size * 2);
            context.fillRect(-p.size, -p.size * .18, p.size * 2, p.size * .36);
          } else {
            context.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * .65);
          }
          context.restore();
        }
        context.globalAlpha = 1;
        window.requestAnimationFrame(frame);
      };
      window.requestAnimationFrame(frame);
    }
    if (Object.prototype.hasOwnProperty.call(topics, topic) &&
        !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      document.body.classList.add("fx-stage");
      launchConfetti();
    }
  </script>
</body>
</html>
