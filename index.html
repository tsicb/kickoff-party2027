<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d1b">
  <meta name="description" content="挨拶だけで、意思疎通の限界を超えろ！ お世話様ですって言うゲーム">
  <title>お世話様ですって言うゲーム | KICKOFF PARTY 2027</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, system-ui, sans-serif;
      color: #fffdf6;
      background: #080d1b;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background:
        radial-gradient(ellipse 70% 63% at 50% -17%, #324d91 0%, transparent 76%),
        radial-gradient(ellipse 42% 48% at 1% 94%, #164366 0%, transparent 77%),
        radial-gradient(ellipse 40% 38% at 100% 90%, #38224f 0%, transparent 80%),
        #080d1b;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .18;
      background-image: radial-gradient(circle, #a8b8df 0.8px, transparent 1px);
      background-size: 25px 25px;
      mask-image: linear-gradient(to bottom, transparent, #000 25%, #000 88%, transparent);
    }
    .stage { min-height: 100svh; }
    .launch {
      position: relative;
      display: flex;
      min-height: 100svh;
      width: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(15px, 3vh, 32px);
      padding: clamp(25px, 5vw, 80px);
      text-align: center;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .launch::before {
      content: "";
      position: absolute;
      z-index: -1;
      width: min(70vw, 750px);
      height: min(70vw, 750px);
      border: 1px solid #ffffff0e;
      border-radius: 50%;
      box-shadow: 0 0 0 80px #ffffff04, 0 0 0 160px #ffffff03;
      pointer-events: none;
    }
    .launch:focus-visible { outline: 4px solid #f8dc92; outline-offset: -8px; }
    .tagline {
      margin: 0;
      color: #f5d18a;
      font-size: clamp(23px, 2.85vw, 47px);
      font-weight: 900;
      line-height: 1.5;
      letter-spacing: .06em;
      text-wrap: balance;
      text-shadow: 0 4px 25px #0007;
    }
    h1 {
      max-width: 1450px;
      margin: 0;
      font-size: clamp(47px, 6.1vw, 108px);
      font-weight: 950;
      line-height: 1.34;
      letter-spacing: .05em;
      text-wrap: balance;
      text-shadow: 0 8px 36px #000a;
    }
    @media (max-width: 620px) {
      .launch { gap: 22px; padding: 28px 20px; }
      .tagline { font-size: clamp(18px, 5.2vw, 28px); }
      h1 { font-size: clamp(37px, 10vw, 57px); line-height: 1.42; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <a class="launch" href="example.html" aria-label="例題のページへ進む">
      <p class="tagline">挨拶だけで、意思疎通の限界を超えろ！</p>
      <h1>お世話様ですって言うゲーム</h1>
    </a>
  </main>
  <script>
    "use strict";
    document.addEventListener("keydown", (event) => {
      if (event.altKey || event.ctrlKey || event.metaKey || event.repeat) return;
      if (event.key === "ArrowRight") window.location.assign("example.html");
    });
  </script>
</body>
</html>
