<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090e1d">
  <meta name="description" content="お世話様ですって言うゲーム — 8つの漢字からお題を選ぼう。">
  <title>お世話様ですって言うゲーム | KICKOFF PARTY 2027</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, system-ui, sans-serif;
      color: #fffdf6;
      background: #080d1b;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      min-height: 100svh;
      margin: 0;
      background:
        radial-gradient(ellipse 65% 58% at 50% -15%, #293c79 0%, transparent 75%),
        radial-gradient(ellipse 45% 40% at 0% 94%, #142f4f 0%, transparent 76%),
        radial-gradient(ellipse 38% 30% at 100% 90%, #281b43 0%, transparent 76%),
        #080d1b;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .14;
      background-image: radial-gradient(circle, #a8b8df 0.75px, transparent 1px);
      background-size: 25px 25px;
      mask-image: linear-gradient(to bottom, transparent, #000 30%, #000 90%, transparent);
    }
    .shell {
      position: relative;
      width: min(1190px, calc(100% - 66px));
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(22px, 3.4vh, 35px);
      margin: 0 auto;
      padding: 32px 0;
    }
    .intro { text-align: center; }
    .tagline {
      margin: 0;
      color: #f5d18a;
      font-size: clamp(14px, 1.55vw, 22px);
      font-weight: 850;
      line-height: 1.5;
      letter-spacing: .065em;
      text-wrap: balance;
    }
    h1 {
      margin: 10px 0 0;
      font-size: clamp(32px, 4.35vw, 65px);
      font-weight: 950;
      letter-spacing: .055em;
      line-height: 1.3;
      text-wrap: balance;
      text-shadow: 0 5px 28px #000a;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(12px, 1.5vw, 18px);
    }
    .tile {
      --top: #5671b9;
      --bottom: #263c70;
      --glow: #8caaff;
      appearance: none;
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      width: 100%;
      min-width: 0;
      aspect-ratio: 1.21;
      overflow: hidden;
      padding: 12px;
      border: 1px solid #ffffff69;
      border-radius: 21px;
      color: white;
      font: inherit;
      cursor: pointer;
      background:
        radial-gradient(ellipse 78% 72% at 24% 8%, #ffffff6c 0%, transparent 70%),
        linear-gradient(145deg, var(--top), var(--bottom));
      box-shadow: inset 0 2px 1px #ffffff4b, inset 0 -13px 25px #0208193d, 0 11px 25px #0005;
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .tile::before {
      content: "";
      position: absolute;
      inset: 9px;
      z-index: -1;
      border: 1px solid #ffffff45;
      border-radius: 13px;
      pointer-events: none;
    }
    .tile::after {
      content: "";
      position: absolute;
      z-index: -1;
      width: 74%;
      aspect-ratio: 1;
      left: 13%;
      top: 9%;
      border-radius: 50%;
      border: 1px solid #ffffff35;
      box-shadow: 0 0 0 27px #ffffff0d, 0 0 0 55px #ffffff08;
      pointer-events: none;
    }
    .kanji {
      font-family: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif CJK JP", serif;
      font-size: clamp(75px, 9vw, 136px);
      font-weight: 900;
      line-height: 1.05;
      text-shadow: 0 6px 2px #00000010, 0 15px 28px #0005;
      transform: translateY(-2px);
    }
    .tile:hover {
      transform: translateY(-4px);
      border-color: #fff9;
      box-shadow: inset 0 2px 1px #ffffff6b, 0 15px 34px #0009, 0 0 24px color-mix(in srgb, var(--glow), transparent 65%);
    }
    .tile:active { transform: scale(.985); }
    .tile:focus-visible { outline: 3px solid #ffe8a4; outline-offset: 5px; }
    .tile[data-kanji="熱"] { --top: #ff9058; --bottom: #c82b51; --glow: #ff795a; }
    .tile[data-kanji="可"] { --top: #56d5cb; --bottom: #167aaf; --glow: #38e8d6; }
    .tile[data-kanji="痛"] { --top: #b592f4; --bottom: #6550ac; --glow: #9e6df6; }
    .tile[data-kanji="格"] { --top: #609beb; --bottom: #2554a3; --glow: #4d87f7; }
    .tile[data-kanji="笑"] { --top: #f7c762; --bottom: #e78b3b; --glow: #ffd364; }
    .tile[data-kanji="秘"] { --top: #d17ab7; --bottom: #7e438e; --glow: #e687d5; }
    .tile[data-kanji="焦"] { --top: #f26f7b; --bottom: #a83767; --glow: #ef6c8b; }
    .tile[data-kanji="達"] { --top: #8ed789; --bottom: #378b71; --glow: #8dec8b; }
    dialog {
      width: min(440px, calc(100% - 28px));
      border: 1px solid #ffffff47;
      border-radius: 24px;
      padding: 38px 28px 32px;
      background: radial-gradient(circle at 50% -12%, #294a82, transparent 72%), #101a31;
      box-shadow: 0 24px 90px #000c;
      color: white;
      text-align: center;
    }
    dialog::backdrop { background: #02050bba; backdrop-filter: blur(6px); }
    .dialog-kanji {
      display: block;
      margin-bottom: 6px;
      color: #ffe7a8;
      font: 900 94px/1.2 "Yu Mincho", "Hiragino Mincho ProN", serif;
      text-shadow: 0 0 30px #ffdc7a66;
    }
    dialog h2 { margin: 0 0 25px; font-size: 24px; letter-spacing: .05em; }
    .dialog-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 11px; }
    .action {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 46px;
      padding: 12px 23px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: #f9d37a;
      color: #16213b;
      font: 800 14px/1.3 inherit;
      font-family: inherit;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
    }
    .action:hover { background: #ffe29a; }
    .action--secondary { border-color: #c6d3ea77; color: #e0e9fc; background: transparent; }
    .action--secondary:hover { background: #ffffff12; }
    .action:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    @media (max-width: 900px) {
      .shell { width: min(750px, calc(100% - 44px)); }
      .grid { gap: 12px; }
      .tile { aspect-ratio: 1; border-radius: 16px; }
      .tile::before { inset: 6px; border-radius: 11px; }
      .kanji { font-size: clamp(59px, 10vw, 100px); }
    }
    @media (max-width: 620px) {
      .shell { width: min(450px, calc(100% - 32px)); justify-content: flex-start; gap: 24px; padding: 30px 0; }
      .tagline { font-size: clamp(13px, 3.7vw, 17px); }
      h1 { font-size: clamp(27px, 7.6vw, 40px); }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
      .tile { aspect-ratio: 1.12; border-radius: 17px; }
      .kanji { font-size: clamp(78px, 21vw, 117px); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0s !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="intro">
      <p class="tagline">挨拶だけで、意思疎通の限界を超えろ！</p>
      <h1>お世話様ですって言うゲーム</h1>
    </header>
    <section class="grid" aria-label="8つのジャンル">
      <button class="tile" type="button" data-kanji="熱" aria-label="「熱」のジャンルを選択"><span class="kanji">熱</span></button>
      <button class="tile" type="button" data-kanji="可" aria-label="「可」のジャンルを選択"><span class="kanji">可</span></button>
      <button class="tile" type="button" data-kanji="痛" aria-label="「痛」のジャンルを選択"><span class="kanji">痛</span></button>
      <button class="tile" type="button" data-kanji="格" aria-label="「格」のジャンルを選択"><span class="kanji">格</span></button>
      <button class="tile" type="button" data-kanji="笑" aria-label="「笑」のジャンルを選択"><span class="kanji">笑</span></button>
      <button class="tile" type="button" data-kanji="秘" aria-label="「秘」のジャンルを選択"><span class="kanji">秘</span></button>
      <button class="tile" type="button" data-kanji="焦" aria-label="「焦」のジャンルを選択"><span class="kanji">焦</span></button>
      <button class="tile" type="button" data-kanji="達" aria-label="「達」のジャンルを選択"><span class="kanji">達</span></button>
    </section>
  </main>
  <dialog id="category-dialog" aria-labelledby="dialog-title">
    <span class="dialog-kanji" id="dialog-kanji" aria-hidden="true"></span>
    <h2 id="dialog-title"></h2>
    <div class="dialog-actions">
      <button class="action action--secondary" type="button" id="dialog-close">パネルに戻る</button>
      <a class="action" id="dialog-next" href="choice.html">お題へ進む →</a>
    </div>
  </dialog>
  <script>
    "use strict";
    const dialog = document.getElementById("category-dialog");
    const kanjiEl = document.getElementById("dialog-kanji");
    const titleEl = document.getElementById("dialog-title");
    const nextLink = document.getElementById("dialog-next");
    document.querySelectorAll(".tile").forEach((tile) => {
      tile.addEventListener("click", () => {
        const kanji = tile.dataset.kanji;
        kanjiEl.textContent = kanji;
        titleEl.textContent = "「" + kanji + "」を選択";
        nextLink.href = "choice.html?topic=" + encodeURIComponent(kanji);
        dialog.showModal();
      });
    });
    document.getElementById("dialog-close").addEventListener("click", () => dialog.close());
    dialog.addEventListener("click", (event) => {
      if (event.target === dialog) dialog.close();
    });
  </script>
</body>
</html>
