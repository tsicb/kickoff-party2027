<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090e1d">
  <meta name="description" content="KICKOFF PARTY 2027。8つの漢字から挑戦するジャンルを選ぼう。">
  <title>KICKOFF PARTY 2027 | ジャンルセレクト</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080d1b;
      --white: #fffdf6;
      --muted: #a9b8d4;
      --surface: #101b32;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100svh;
      color: var(--white);
      overflow-x: hidden;
      background:
        radial-gradient(ellipse 68% 54% at 50% -10%, #273b78 0%, transparent 75%),
        radial-gradient(ellipse 42% 32% at 0% 82%, #112e50 0%, transparent 77%),
        radial-gradient(ellipse 40% 34% at 100% 88%, #28183f 0%, transparent 76%),
        var(--bg);
    }
    body::before {
      content: "";
      position: fixed;
      z-index: -1;
      inset: 0;
      opacity: .18;
      pointer-events: none;
      background-image: radial-gradient(circle, #9baed6 0.8px, transparent 1px);
      background-size: 25px 25px;
      mask-image: linear-gradient(to bottom, transparent 4%, #000 35%, #000 88%, transparent);
    }
    .ambient {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
    }
    .ambient::before, .ambient::after {
      content: "";
      position: absolute;
      width: 38vw;
      height: 38vw;
      min-width: 240px;
      min-height: 240px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .15;
    }
    .ambient::before { left: -23vw; top: 20vh; background: #19a6ff; }
    .ambient::after { right: -23vw; bottom: -14vh; background: #bf4ff9; }
    .shell {
      width: min(1160px, calc(100% - 64px));
      margin-inline: auto;
      padding: 30px 0 38px;
    }
    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      color: #c8d6f2;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: .21em;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 31px;
      height: 31px;
      color: #0b1530;
      background: #fbde85;
      border-radius: 9px;
      font-size: 16px;
      box-shadow: 0 0 22px #f9c84d44;
      letter-spacing: 0;
    }
    .edition { color: #92a5c6; font-size: 11px; }
    .intro { text-align: center; padding: 26px 0 26px; }
    .eyebrow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #e5bf6e;
      font-family: system-ui, sans-serif;
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .32em;
    }
    .eyebrow::before, .eyebrow::after {
      content: "";
      display: block;
      width: 32px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #e5bf6e);
    }
    .eyebrow::after { transform: rotate(180deg); }
    h1 {
      margin: 12px 0 8px;
      font-size: clamp(33px, 4.65vw, 60px);
      font-weight: 950;
      line-height: 1.28;
      letter-spacing: .075em;
      text-wrap: balance;
      text-shadow: 0 5px 28px #0008;
    }
    .intro p {
      margin: 0;
      font-size: clamp(12px, 1.4vw, 15px);
      line-height: 1.8;
      color: #b9c7e1;
      letter-spacing: .08em;
    }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 2px 13px;
    }
    .section-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font: 800 12px system-ui, sans-serif;
      letter-spacing: .19em;
      color: #e4ecff;
    }
    .section-title::before {
      content: "";
      width: 4px;
      height: 17px;
      border-radius: 3px;
      background: #f1c670;
      box-shadow: 0 0 14px #ecc36a91;
    }
    .count {
      color: #8598bb;
      font: 750 11px system-ui, sans-serif;
      letter-spacing: .12em;
    }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 17px; }
    .tile {
      --top: #5671b9;
      --bottom: #263c70;
      --glow: #8caaff;
      --ink: #fff;
      appearance: none;
      font: inherit;
      display: block;
      position: relative;
      isolation: isolate;
      width: 100%;
      aspect-ratio: 1.15;
      overflow: hidden;
      padding: 0;
      border: 1px solid #ffffff59;
      border-radius: 20px;
      color: var(--ink);
      text-align: center;
      cursor: pointer;
      background:
        radial-gradient(ellipse 78% 72% at 24% 8%, #ffffff6c 0%, transparent 70%),
        linear-gradient(145deg, var(--top), var(--bottom));
      box-shadow:
        inset 0 2px 1px #ffffff4b,
        inset 0 -13px 25px #0208193d,
        0 11px 25px #0005;
      transform: translateY(0);
      transition: transform .24s cubic-bezier(.2,.8,.2,1), box-shadow .24s, border-color .24s;
      -webkit-tap-highlight-color: transparent;
    }
    .tile::before {
      content: "";
      position: absolute;
      inset: 9px;
      z-index: -1;
      border: 1px solid #ffffff45;
      border-radius: 13px;
    }
    .tile::after {
      content: "";
      position: absolute;
      z-index: -1;
      width: 75%;
      aspect-ratio: 1;
      left: 12%;
      top: 10%;
      border-radius: 50%;
      border: 1px solid #ffffff3d;
      box-shadow: 0 0 0 27px #ffffff0d, 0 0 0 55px #ffffff08;
      transform: rotate(-17deg);
      transition: transform .35s ease;
    }
    .tile__number {
      position: absolute;
      left: 23px;
      top: 20px;
      color: #fffbe9be;
      font: 800 12px ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .1em;
    }
    .tile__arrow {
      position: absolute;
      right: 22px;
      bottom: 17px;
      display: grid;
      place-items: center;
      width: 27px;
      height: 27px;
      border: 1px solid #ffffff68;
      border-radius: 50%;
      color: white;
      font: 18px system-ui, sans-serif;
      line-height: 1;
      transition: transform .25s;
    }
    .tile__kanji {
      display: grid;
      place-items: center;
      height: 100%;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif CJK JP", serif;
      font-size: clamp(80px, 8.9vw, 122px);
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 5px 1px #00000017, 0 14px 29px #0000003e;
      transform: translateY(-2px);
      transition: transform .24s ease, text-shadow .24s ease;
    }
    .tile__accent {
      position: absolute;
      left: 23px;
      bottom: 23px;
      display: block;
      width: 24px;
      height: 3px;
      border-radius: 4px;
      background: #ffffffba;
      box-shadow: 0 0 13px #ffffff85;
    }
    .tile:hover {
      transform: translateY(-7px);
      border-color: #fff8;
      box-shadow:
        inset 0 2px 1px #ffffff74,
        inset 0 -14px 30px #02081933,
        0 19px 34px #0009,
        0 0 30px color-mix(in srgb, var(--glow), transparent 65%);
    }
    .tile:hover::after { transform: rotate(17deg) scale(1.12); }
    .tile:hover .tile__kanji { transform: translateY(-6px) scale(1.055); text-shadow: 0 13px 32px #0006; }
    .tile:hover .tile__arrow { transform: translate(3px, -3px); }
    .tile:active { transform: translateY(-1px) scale(.985); }
    .tile:focus-visible { outline: 3px solid #fff6b0; outline-offset: 5px; }
    .tile[data-kanji="熱"] { --top: #ff9058; --bottom: #c82b51; --glow: #ff795a; }
    .tile[data-kanji="可"] { --top: #56d5cb; --bottom: #167aaf; --glow: #38e8d6; }
    .tile[data-kanji="痛"] { --top: #b592f4; --bottom: #6550ac; --glow: #9e6df6; }
    .tile[data-kanji="格"] { --top: #609beb; --bottom: #2554a3; --glow: #4d87f7; }
    .tile[data-kanji="笑"] { --top: #f7c762; --bottom: #e78b3b; --glow: #ffd364; --ink: #fffef4; }
    .tile[data-kanji="秘"] { --top: #d17ab7; --bottom: #7e438e; --glow: #e687d5; }
    .tile[data-kanji="焦"] { --top: #f26f7b; --bottom: #a83767; --glow: #ef6c8b; }
    .tile[data-kanji="達"] { --top: #8ed789; --bottom: #378b71; --glow: #8dec8b; }
    .bottomline {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin: 26px 0 0;
      color: #8193b4;
      font: 700 10px system-ui, sans-serif;
      letter-spacing: .22em;
    }
    .bottomline::before, .bottomline::after {
      content: "";
      width: min(8vw, 58px);
      height: 1px;
      background: linear-gradient(90deg, transparent, #8397b8);
      opacity: .55;
    }
    .bottomline::after { transform: rotate(180deg); }
    dialog {
      width: min(420px, calc(100% - 28px));
      border: 1px solid #ffffff47;
      border-radius: 24px;
      padding: 36px 30px 30px;
      background:
        radial-gradient(circle at 50% -12%, #294a82, transparent 72%),
        #101a31;
      box-shadow: 0 24px 90px #000c;
      color: #fff;
      text-align: center;
    }
    dialog::backdrop { background: #02050bb8; backdrop-filter: blur(6px); }
    .dialog-kanji {
      display: block;
      font: 900 92px/1.2 "Yu Mincho", "Hiragino Mincho ProN", serif;
      margin: 0 0 10px;
      color: #ffe7a8;
      text-shadow: 0 0 30px #ffdc7a66;
    }
    dialog h2 { font-size: 22px; margin: 0 0 12px; letter-spacing: .07em; }
    dialog p { color: #bdc9df; line-height: 1.9; font-size: 14px; margin: 0 0 24px; }
    .back {
      appearance: none;
      padding: 13px 28px;
      border-radius: 999px;
      border: 0;
      background: #f9d37a;
      color: #16213b;
      font: 850 14px inherit;
      font-family: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    .back:hover { background: #ffdf98; }
    .back:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    @media (max-width: 900px) {
      .shell { width: min(760px, calc(100% - 42px)); }
      .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 11px; }
      .tile { border-radius: 15px; aspect-ratio: .97; }
      .tile::before { inset: 6px; border-radius: 10px; }
      .tile__kanji { font-size: clamp(57px, 10vw, 90px); }
      .tile__number { left: 15px; top: 12px; font-size: 10px; }
      .tile__accent { left: 15px; bottom: 15px; width: 16px; height: 2px; }
      .tile__arrow { width: 22px; height: 22px; right: 12px; bottom: 11px; font-size: 14px; }
    }
    @media (max-width: 620px) {
      .shell { width: min(460px, calc(100% - 34px)); padding-top: 22px; }
      .topline { font-size: 10px; letter-spacing: .12em; }
      .edition { font-size: 10px; letter-spacing: .05em; }
      .intro { padding: 35px 0 29px; }
      .intro h1 { font-size: clamp(29px, 7vw, 41px); }
      .intro p { max-width: 290px; margin: auto; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
      .tile { aspect-ratio: 1.09; border-radius: 17px; }
      .tile__kanji { font-size: clamp(80px, 20vw, 112px); }
      .section-head { padding-bottom: 13px; }
      .bottomline { margin-top: 25px; letter-spacing: .11em; }
    }
    @media (max-width: 340px) {
      .tile__kanji { font-size: 71px; }
      .brand { gap: 6px; }
      .edition { font-size: 9px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <main class="shell">
    <header class="topline">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span><span>KICKOFF PARTY <span style="color:#f8d783">2027</span></span></div>
      <span class="edition">THE 8 CHOICES</span>
    </header>
    <section class="intro" aria-labelledby="main-title">
      <div class="eyebrow">QUIZ SELECT</div>
      <h1 id="main-title">一文字から、始まる。</h1>
      <p>8つの漢字、8つの扉。<br>気になるパネルを選んでください。</p>
    </section>
    <section aria-labelledby="select-title">
      <div class="section-head">
        <span class="section-title" id="select-title">SELECT A CATEGORY</span>
        <span class="count">01 — 08</span>
      </div>
      <div class="grid" id="category-grid">
        <button class="tile" type="button" data-kanji="熱" data-target="" aria-label="熱のジャンルを選択"><span class="tile__number" aria-hidden="true">01</span><span class="tile__kanji">熱</span><span class="tile__accent" aria-hidden="true"></span><span class="tile__arrow" aria-hidden="true">↗</span></button>
        <button class="tile" type="button" data-kanji="可" data-target="" aria-label="可のジャンルを選択"><span class="tile__number" aria-hidden="true">02</span><span class="tile__kanji">可</span><span class="tile__accent" aria-hidden="true"></span><span class="tile__arrow" aria-hidden="true">↗</span></button>
        <button class="tile" type="button" data-kanji="痛" data-target="" aria-label="痛のジャンルを選択"><span class="tile__number" aria-hidden="true">03</span><span class="tile__kanji">痛</span><span class="tile__accent" aria-hidden="true"></span><span class="tile__arrow" aria-hidden="true">↗</span></button>
        <button class="tile" type="button" data-kanji="格" data-target="" aria-label="格のジャンルを選択"><span class="tile__number" aria-hidden="true">04</span><span class="tile__kanji">格</span><span class="tile__accent" aria-hidden="true"></span><span class="tile__arrow" aria-hidden="true">↗</span></button>
        <button class="tile" type="button" data-kanji="笑" data-target="" aria-label="笑のジャンルを選択"><span class="tile__number" aria-hidden="true">05</span><span class="tile__kanji">笑</span><span class="tile__accent" aria-hidden="true"></span><span class="tile__arrow" aria-hidden="true">↗</span></button>
        <button class="tile" type="button" data-kanji="秘" data-target="" aria-label="秘のジャンルを選択"><span class="tile__number" aria-hidden="true">06</span><span class="tile__kanji">秘</span><span class="tile__accent" aria-hidden="true"></span><span class="tile__arrow" aria-hidden="true">↗</span></button>
        <button class="tile" type="button" data-kanji="焦" data-target="" aria-label="焦のジャンルを選択"><span class="tile__number" aria-hidden="true">07</span><span class="tile__kanji">焦</span><span class="tile__accent" aria-hidden="true"></span><span class="tile__arrow" aria-hidden="true">↗</span></button>
        <button class="tile" type="button" data-kanji="達" data-target="" aria-label="達のジャンルを選択"><span class="tile__number" aria-hidden="true">08</span><span class="tile__kanji">達</span><span class="tile__accent" aria-hidden="true"></span><span class="tile__arrow" aria-hidden="true">↗</span></button>
      </div>
    </section>
    <footer class="bottomline">CHOOSE YOUR FIRST CHALLENGE</footer>
  </main>
  <dialog id="coming-soon" aria-labelledby="dialog-title">
    <span class="dialog-kanji" id="dialog-kanji" aria-hidden="true"></span>
    <h2 id="dialog-title"></h2>
    <p>このジャンルのページは、次の工程で追加予定です。<br>まずは8つのパネルのデザインをお楽しみください。</p>
    <button class="back" type="button" id="dialog-close">パネルに戻る</button>
  </dialog>
  <script>
    const dialog = document.getElementById("coming-soon");
    const kanjiEl = document.getElementById("dialog-kanji");
    const titleEl = document.getElementById("dialog-title");
    document.querySelectorAll(".tile").forEach((tile) => {
      tile.addEventListener("click", () => {
        const target = tile.dataset.target;
        if (target) {
          window.location.href = new URL(target, document.baseURI).href;
          return;
        }
        kanjiEl.textContent = tile.dataset.kanji;
        titleEl.textContent = "「" + tile.dataset.kanji + "」を選択";
        if (typeof dialog.showModal === "function") dialog.showModal();
      });
    });
    document.getElementById("dialog-close").addEventListener("click", () => dialog.close());
    dialog.addEventListener("click", (event) => {
      if (event.target === dialog) dialog.close();
    });
  </script>
</body>
</html>
